# Staging Fly.io app — mirror of fly.toml with OAuth 2.1 enabled.
#
# Sanitized staging reference configuration. Replace the app name and
# secrets in a private deployment environment; do not commit production
# topology here.
#
# Deploy with: `fly deploy -c fly.staging.example.toml`
# Staging is the place to validate WEFT_OAUTH_ENABLED with real clients.
app = "weft-mcp-staging-example"
primary_region = "iad"
kill_timeout = "15s"

[deploy]
  strategy = "bluegreen"

[build]

[env]
  WEFT_ENV = "production"
  WEFT_MIGRATION_MODE = "verify"
  WEFT_TRANSPORT = "streamable-http"
  WEFT_REDIS_URL = ""
  WEFT_LOG_LEVEL = "INFO"
  PORT = "8000"
  # Route 1 OAuth 2.1 — staging is where we validate the full dance
  # before flipping the same flag on weft-mcp.
  WEFT_OAUTH_ENABLED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
