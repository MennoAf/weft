services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: weft
      POSTGRES_USER: weft
      POSTGRES_PASSWORD: weft_local
    ports:
      - 5433:5432
    volumes:
      - weft-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U weft]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - 6380:6379
    volumes:
      - weft-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  weft-postgres-data:
  weft-redis-data:
