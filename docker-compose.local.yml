# Standalone local Docker RC contract.
# Unlike docker-compose.weft.yml (host-native `weft up`), this file owns the
# app process and connects it to private Compose-network services by DNS.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: weft
      POSTGRES_USER: weft
      POSTGRES_PASSWORD: ${WEFT_LOCAL_DB_PASSWORD:-weft_local}
    volumes:
      - weft-local-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U weft -d weft"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  redis:
    image: redis:7-alpine
    volumes:
      - weft-local-redis-data:/data
    command: [redis-server, --appendonly, yes]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    image: ${WEFT_LOCAL_IMAGE:-weft-rc-local:1.0.0rc1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # These values are supplied at invocation time. The API key is never an
      # image layer, Compose default, or committed file value.
      WEFT_API_KEY: ${WEFT_LOCAL_API_KEY:?WEFT_LOCAL_API_KEY must be supplied at runtime}
      WEFT_DEFAULT_USER_ID: ${WEFT_LOCAL_USER_ID:?WEFT_LOCAL_USER_ID must be supplied at runtime}
      WEFT_ENV: production
      WEFT_TRANSPORT: streamable-http
      WEFT_MIGRATION_MODE: apply
      WEFT_DATABASE_URL: postgresql://weft:${WEFT_LOCAL_DB_PASSWORD:-weft_local}@postgres:5432/weft
      WEFT_REDIS_URL: redis://redis:6379
      WEFT_OUTBOUND_CONNECTOR: none
      WEFT_QUARANTINE_REVIEW_ENABLED: "0"
      PORT: "8000"
    ports:
      # Only the host loopback is published. Postgres and Redis have no host
      # ports and are reachable solely through the private Compose network.
      - "127.0.0.1:${WEFT_LOCAL_PORT:-18000}:8000"
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3);
          raise SystemExit(0 if response.status == 200 else 1)
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  weft-local-postgres-data:
  weft-local-redis-data:
