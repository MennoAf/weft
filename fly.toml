app = "weft-mcp"
primary_region = "iad"

[deploy]
  strategy = "bluegreen"

[build]

[env]
  WEFT_ENV = "production"
  WEFT_TRANSPORT = "streamable-http"
  WEFT_REDIS_URL = ""
  WEFT_BASE_URL = "https://weft-mcp.fly.dev"
  WEFT_LOG_LEVEL = "INFO"
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
