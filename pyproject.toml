[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weft-memory"
version = "0.1.0"
description = "Persistent agent memory system with semantic retrieval"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Jason Bauman" }]
dependencies = [
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.0.0",
    "fastmcp>=3.0.2,<4",
    "click>=8.1.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
    "fastembed>=0.4.0",
    "PyJWT>=2.8.0",
    "authlib>=1.3,<2",
    "cryptography>=42",
    "itsdangerous>=2.2",
    "python-dotenv>=1.0.0",
    "python-frontmatter>=1.1.0",
    "python-dateutil>=2.9.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.42.0"]
openai = ["openai>=1.0.0"]
slack = ["slack-sdk>=3.30.0"]
discord = ["discord.py>=2.4.0", "aiohttp>=3.13.3"]
google = ["google-api-python-client>=2.100.0", "google-auth-oauthlib>=1.1.0"]
all = [
    "anthropic>=0.42.0",
    "openai>=1.0.0",
    "slack-sdk>=3.30.0",
    "discord.py>=2.4.0",
    "aiohttp>=3.13.3",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
]

[project.scripts]
weft = "weft.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "testcontainers[postgres,redis]>=4.0",
    "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["weft", "capability_registry"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
