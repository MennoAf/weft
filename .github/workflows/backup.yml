name: Scheduled Weft Backup

on:
  schedule:
    # Every 4 hours at :15 past to avoid top-of-hour congestion
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      commit_to_branch:
        description: "Also commit backup to the backups branch"
        type: boolean
        default: false

env:
  BACKUP_FILE: weft-backup.json

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --no-dev

      - name: Run backup
        env:
          # Use BACKUP_DATABASE_URL (pooler, port 6543) if set, otherwise fall back to DATABASE_URL
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          # Debug: show masked connection info (host and port only)
          python3 -c "
          import os, re
          url = os.environ.get('DATABASE_URL', '')
          m = re.search(r'@([^/]+)', url)
          print(f'Connecting to: {m.group(1) if m else \"(could not parse host)\"}')
          "
          uv run weft backup -o "$BACKUP_FILE"

      - name: Validate backup
        run: |
          # File must exist and be non-empty
          if [ ! -s "$BACKUP_FILE" ]; then
            echo "::error::Backup file is empty or missing"
            exit 1
          fi

          # Extract and validate memory count
          MEMORY_COUNT=$(python3 -c "import json; print(json.load(open('$BACKUP_FILE'))['memory_count'])")
          echo "Memory count: $MEMORY_COUNT"

          if [ "$MEMORY_COUNT" -eq 0 ]; then
            echo "::error::Backup contains 0 memories — expected data"
            exit 1
          fi

          # Show file size
          FILE_SIZE=$(stat -c%s "$BACKUP_FILE" 2>/dev/null || stat -f%z "$BACKUP_FILE")
          echo "Backup size: $FILE_SIZE bytes"
          echo "## Backup Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Memories: $MEMORY_COUNT" >> "$GITHUB_STEP_SUMMARY"
          echo "- File size: $FILE_SIZE bytes" >> "$GITHUB_STEP_SUMMARY"
          echo "- Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: weft-backup-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90

      - name: Commit to backups branch
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.commit_to_branch == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)

          # Stash the backup file outside the working tree
          cp "$BACKUP_FILE" /tmp/weft-backup.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create or fetch the backups branch
          if git ls-remote --exit-code origin backups >/dev/null 2>&1; then
            git fetch origin backups
            git checkout backups
          else
            git checkout --orphan backups
            git rm -rf .
          fi

          # Copy backup files into place
          cp /tmp/weft-backup.json "weft-backup-${TIMESTAMP}.json"
          cp /tmp/weft-backup.json "weft-backup-latest.json"

          git add "weft-backup-${TIMESTAMP}.json" "weft-backup-latest.json"
          git commit -m "Backup ${TIMESTAMP}" || echo "No changes to commit"
          git push origin backups
